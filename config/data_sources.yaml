# ERDDAP Data Sources
erddap:
  # GFS atmospheric data via PacIOOS
  gfs:
    server: "https://pae-paha.pacioos.hawaii.edu/erddap"
    dataset_id: "ncep_global"
    variables:
      - "ugrd10m"   # 10m U wind component
      - "vgrd10m"   # 10m V wind component
      - "pratesfc"  # Precipitation rate
    temporal_resolution: "3hourly"
    
  # NOAA CoastWatch fallback datasets
  noaa_coastwatch:
    server: "https://coastwatch.pfeg.noaa.gov/erddap"
    chlorophyll:
      dataset_id: "noaacwNPPN20S3ASCIDINEOF2kmDaily"
      variable: "chlor_a"
    kd490:
      dataset_id: "noaacwNPPN20S3AkdSCIDINEOF2kmDaily"
      variable: "kd2"
    temporal_resolution: "daily"
    spatial_resolution: "2km"

