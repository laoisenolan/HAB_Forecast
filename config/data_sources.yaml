# Spatial boundaries for Seto Inland Sea
spatial_bounds:
  north: 35.0
  south: 34.0
  east: 135.0
  west: 132.0
  resolution_km: 2.0

# Temporal settings
temporal:
  climatology_start: "2002-01-01"
  climatology_end: "2024-12-31"
  forecast_lead_days: 7
  aggregation_period: "weekly"
  
# Historical data collection settings
historical:
  # Historical data collection periods
  collection_periods:
    - name: "full_historical"
      start_date: "2002-01-01"
      end_date: "2025-07-31"
      description: "Complete historical dataset from 2002 to 2024"
    - name: "recent_decade"
      start_date: "2014-01-01"
      end_date: "2024-12-31"
      description: "Recent decade of data (2014-2024)"
    - name: "last_five_years"
      start_date: "2019-01-01"
      end_date: "2024-12-31"
      description: "Last five years of data (2019-2024)"
  
  # Chunking settings for large historical downloads
  chunk_settings:
    time_chunk_days: 30  # Download data in 30-day chunks
    max_concurrent_downloads: 3  # Maximum concurrent downloads
    retry_attempts: 3  # Number of retry attempts for failed downloads
    
  # Storage settings for historical data
  storage:
    compress_historical: true
    historical_data_format: "netcdf4"
    metadata_included: true

# Copernicus Marine Data Sources - Updated with 19 WORKING Variables (76% Coverage)
copernicus_marine:
  # ✅ WORKING: Sea Surface Temperature - Updated dataset IDs
  sst:
    nrt_dataset_id: "SST_GLO_SST_L4_NRT_OBSERVATIONS_010_001"  # Near-real-time global SST
    my_dataset_id: "SST_GLO_SST_L4_REP_OBSERVATIONS_010_011"   # Multi-year reprocessed global SST
    variable: "analysed_sst"
    temporal_resolution: "daily"
    spatial_resolution: "0.05°"
    status: "✅ WORKING"
    
  # ✅ WORKING: Ocean Color (Chlorophyll-a) - Updated dataset IDs
  ocean_color:
    nrt_dataset_id: "OCEANCOLOUR_GLO_BGC_L3_NRT_009_101"       # Near-real-time global ocean color
    my_dataset_id: "OCEANCOLOUR_GLO_BGC_L3_MY_009_107"         # Multi-year global ocean color
    variable: "CHL"
    temporal_resolution: "daily"
    spatial_resolution: "4km"
    status: "✅ WORKING"
    
  # ✅ WORKING: Physics data (HYCOM substitution for missing Copernicus variables)
  physics:
    dataset_id: "cmems_mod_glo_phy_anfc_0.083deg_P1D-m"
    variables:
      # ✅ WORKING - Confirmed in testing  
      - "mlotst"      # Ocean mixed layer thickness defined by sigma theta
      - "zos"         # Sea surface height above geoid
    temporal_resolution: "daily"
    spatial_resolution: "1/12°"
    status: "✅ WORKING - 2/2 available variables confirmed"
    note: "Ocean currents and surface temp/salinity provided by HYCOM (see GEE section)"
    
  # ✅ WORKING: Biogeochemical data - GLOBAL_ANALYSISFORECAST_BGC_001_028
  biogeochemistry:
    dataset_id: "cmems_mod_glo_bgc-pft_anfc_0.25deg_P1D-m"
    variables:
      - "chl"         # Total Chlorophyll - ✅ CONFIRMED WORKING
      - "phyc"        # Total Phytoplankton Carbon - ✅ CONFIRMED WORKING
    temporal_resolution: "daily"
    spatial_resolution: "0.25°"
    status: "✅ WORKING - All 2/2 variables confirmed"
    
  # ✅ WORKING: Nutrients data - Complete nutrient analysis suite
  nutrients:
    dataset_id: "cmems_mod_glo_bgc-nut_anfc_0.25deg_P1D-m"
    variables:
      - "no3"         # Nitrate - ✅ CONFIRMED WORKING
      - "po4"         # Phosphate - ✅ CONFIRMED WORKING
      - "si"          # Dissolved Silicate - ✅ CONFIRMED WORKING
      - "fe"          # Dissolved Iron - ✅ CONFIRMED WORKING
    temporal_resolution: "daily"
    spatial_resolution: "0.25°"
    status: "✅ WORKING - All 4/4 variables confirmed (N, P, Si, Fe complete)"
    
  # ✅ WORKING: Biology data - Primary production and oxygen
  biology:
    dataset_id: "cmems_mod_glo_bgc-bio_anfc_0.25deg_P1D-m"
    variables:
      - "nppv"        # Total Primary Production - ✅ CONFIRMED WORKING
      - "o2"          # Dissolved Oxygen - ✅ CONFIRMED WORKING
    temporal_resolution: "daily"
    spatial_resolution: "0.25°"
    status: "✅ WORKING - All 2/2 variables confirmed"
    
  # ✅ WORKING: Optics data - Water clarity modeling
  optics:
    dataset_id: "cmems_mod_glo_bgc-optics_anfc_0.25deg_P1D-m"
    variables:
      - "kd"          # Diffuse attenuation coefficient - ✅ CONFIRMED WORKING
    temporal_resolution: "daily"
    spatial_resolution: "0.25°"
    status: "✅ WORKING - Confirmed model-based water clarity"
    
  # ❌ TEMPORAL COVERAGE ISSUES: Ocean color observations
  ocean_color_observations:
    turbidity:
      dataset_id: "cmems_obs-oc_glo_bgc-transp_nrt_l3-multi-4km_P1D"
      variable: "KD490"
      issue: "Temporal coverage - try dates after 2022"
      status: "❌ TEMPORAL COVERAGE"
    # ✅ BREAKTHROUGH: WORKING TURBIDITY DATA SOURCES!
    turbidity_daily_gapfree:
      dataset_id: "cmems_obs-oc_glo_bgc-transp_nrt_l4-gapfree-multi-4km_P1D"
      variable: "KD490"
      description: "Daily gap-free transparency/turbidity (BEST OPTION)"
      temporal_coverage: "2025-07-17 to present"
      spatial_resolution: "4km"
      temporal_resolution: "daily"
