# Data quality thresholds
quality_thresholds:
  chlorophyll_a:
    min_valid: 0.01
    max_valid: 100.0
    missing_value: -999.0
  sst:
    min_valid: -5.0
    max_valid: 40.0
    missing_value: -999.0
  wind_speed:
    min_valid: 0.0
    max_valid: 50.0
    missing_value: -999.0
  turbidity_index:
    min_valid: 0.1
    max_valid: 10.0
    missing_value: -999.0

# Processing settings
processing:
  interpolation_method: "bilinear"
  output_crs: "EPSG:4326"
  nodata_value: -9999
  compression: "lzw" 